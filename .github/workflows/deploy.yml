name: Production Artifact Build & Deployment

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release-build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate Release Tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]

      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Production Environment
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: 'pip'

      - name: Validate Release Version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              raise SystemExit(f"Release tag {tag} does not match package version {version}")
          PY

      - name: Install Secure Production Build Tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build==1.6.1 twine==7.0.0 bandit==1.9.4 flake8==7.4.1

      - name: Lint Source Code
        run: |
          python -m flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          python -m flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate Source Code Security
        run: python -m bandit -r src/ -ll

      - name: Compile Distribution Tarballs and Wheels
        run: python -m build

      - name: Audit Built Package Integrity
        run: python -m twine check --strict dist/*

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: maso-production-dist
          path: dist/
          if-no-files-found: error
          retention-days: 5
