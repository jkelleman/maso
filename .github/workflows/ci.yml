Here is the complete, production-ready GitHub Actions CI/CD workflow file to automate your trajectory testing framework.

name: Multi-Agent Stream Orchestration CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Ensure testing and observability suites are available
        pip install pytest pytest-cov pytest-mock mlflow

    - name: Lint and Code Formatting Check
      run: |
        pip install flake8
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Execute Deterministic Trajectory Test Suite
      env:
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        VECTOR_DB_URL: "mock://localhost:8000"
        STREAM_WINDOW_SIZE_SECONDS: 60
      run: |
        python -m pytest tests/evaluation/test_trajectory.py -v --cov=src --cov-report=term-missing
